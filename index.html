<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from './lib/PointerLockControls.js';
import { OrbitControls } from './lib/OrbitControls.js';

/* ============================================================
   尺寸來源（Andy 提供 + 平面圖比例反推）
   室內 27 坪 = 89.26 ㎡ ／ 工作陽台 1.8 坪 = 5.95 ㎡
   客廳採光窗 336.5 cm ／ 樓高 H = 3.25 m
   座標：X 向東（平面圖右）、Z 向南（平面圖下）、Y 向上
   ============================================================ */
const H  = 3.25;            // 樓高
const TW = 0.25;            // 外牆厚
const IW = 0.12;            // 隔間牆厚
const W  = 9.45, D = 10.75; // 全屋外圍

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1218);
scene.fog = new THREE.Fog(0x0e1218, 30, 70);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.05, 250);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------- 材質 ---------- */
const M = {
  wall  : new THREE.MeshStandardMaterial({color:0xf2efe9, roughness:.95}),
  wallO : new THREE.MeshStandardMaterial({color:0xe6e1d8, roughness:.95}),
  woodF : new THREE.MeshStandardMaterial({color:0xb08453, roughness:.72}),
  tileF : new THREE.MeshStandardMaterial({color:0xd9d5cd, roughness:.42, metalness:.02}),
  wetF  : new THREE.MeshStandardMaterial({color:0xb9bcbb, roughness:.35}),
  balcF : new THREE.MeshStandardMaterial({color:0x9c9a96, roughness:.9}),
  glass : new THREE.MeshPhysicalMaterial({color:0xbfe0f5, transparent:true, opacity:.20,
           roughness:.03, metalness:0, transmission:.85, side:THREE.DoubleSide}),
  frame : new THREE.MeshStandardMaterial({color:0x3a3f45, roughness:.5, metalness:.5}),
  wood  : new THREE.MeshStandardMaterial({color:0x8a6240, roughness:.6}),
  woodD : new THREE.MeshStandardMaterial({color:0x5d4230, roughness:.6}),
  fab   : new THREE.MeshStandardMaterial({color:0x6f7f93, roughness:.92}),
  fabL  : new THREE.MeshStandardMaterial({color:0xe8e2d6, roughness:.95}),
  white : new THREE.MeshStandardMaterial({color:0xfbfbfa, roughness:.35}),
  metal : new THREE.MeshStandardMaterial({color:0xb9c0c7, roughness:.28, metalness:.85}),
  dark  : new THREE.MeshStandardMaterial({color:0x22262b, roughness:.45}),
  stone : new THREE.MeshStandardMaterial({color:0x33383f, roughness:.35}),
  green : new THREE.MeshStandardMaterial({color:0x4a7c52, roughness:.85}),
};

/* ---------- 幾何小工具 ---------- */
const colliders = [];  // 碰撞用 AABB
function box(w,h,d,mat,x,y,z,solid=true,rotY=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.rotation.y = rotY;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  if(solid && rotY===0) colliders.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,y1:y+h/2});
  return m;
}

/**
 * 造一道牆，可留門洞 / 窗洞
 * a,b = 沿軸起訖；fixed = 另一軸座標；axis='x' 表示牆沿 X 延伸
 * holes = [{at,w,y0,y1,glass}]  at=洞中心沿軸座標
 */
function wall(axis, a, b, fixed, t, holes=[], mat=M.wall){
  holes = [...holes].sort((p,q)=>p.at-q.at);
  let cur = a;
  const seg = (s,e,y0,y1,solid=true)=>{
    if(e-s < 0.001 || y1-y0 < 0.001) return;
    const L = e-s, cy = (y0+y1)/2, hh = y1-y0, c = (s+e)/2;
    if(axis==='x') box(L,hh,t,mat,c,cy,fixed,solid);
    else           box(t,hh,L,mat,fixed,cy,c,solid);
  };
  for(const h of holes){
    const s = h.at - h.w/2, e = h.at + h.w/2;
    seg(cur, s, 0, H);                       // 洞左邊的實牆
    if(h.y0 > 0.001) seg(s, e, 0, h.y0);     // 洞下方矮牆（窗台）
    if(h.y1 < H-0.001) seg(s, e, h.y1, H);   // 洞上方過樑
    if(h.glass){                             // 玻璃
      const gh = h.y1-h.y0, gy = (h.y0+h.y1)/2;
      if(axis==='x'){
        box(h.w-0.06,gh,0.03,M.glass,h.at,gy,fixed,false);
        box(h.w,0.05,t*1.05,M.frame,h.at,h.y0,fixed,false);
        box(h.w,0.05,t*1.05,M.frame,h.at,h.y1,fixed,false);
      }else{
        box(0.03,gh,h.w-0.06,M.glass,fixed,gy,h.at,false);
        box(t*1.05,0.05,h.w,M.frame,fixed,h.y0,h.at,false);
        box(t*1.05,0.05,h.w,M.frame,fixed,h.y1,h.at,false);
      }
    }
    cur = e;
  }
  seg(cur, b, 0, H);
}

function floorSlab(x0,z0,x1,z1,mat,y=0.02){
  const g = new THREE.Mesh(new THREE.BoxGeometry(x1-x0,0.04,z1-z0),mat);
  g.position.set((x0+x1)/2,y,(z0+z1)/2); g.receiveShadow = true; scene.add(g);
}

/* ============================================================
   房間表（公尺）— 依平面圖比例重建
   ============================================================ */
const R = {
  '主臥室' : {x0:0.13, z0:0.13, x1:3.55, z1:3.30, f:M.woodF, area:10.8},
  '臥室二' : {x0:3.67, z0:0.13, x1:6.05, z1:2.95, f:M.woodF, area:6.7},
  '客廳'   : {x0:6.17, z0:0.13, x1:9.32, z1:4.25, f:M.woodF, area:13.0},
  '餐廳'   : {x0:6.17, z0:4.25, x1:9.32, z1:7.05, f:M.woodF, area:8.8},
  '主浴廁' : {x0:0.40, z0:3.50, x1:3.90, z1:5.78, f:M.wetF,  area:8.0},
  '臥室三' : {x0:0.40, z0:5.95, x1:4.45, z1:8.08, f:M.woodF, area:8.6},
  '走廊'   : {x0:4.45, z0:3.30, x1:6.05, z1:8.08, f:M.woodF, area:7.6},
  '廚房'   : {x0:3.30, z0:8.35, x1:6.40, z1:10.45,f:M.tileF, area:6.5},
  '次浴廁' : {x0:6.60, z0:8.35, x1:8.80, z1:10.35,f:M.wetF,  area:4.4},
  '工作陽台':{x0:0.13, z0:8.35, x1:3.10, z1:10.30,f:M.balcF, area:5.8},
};

/* ---------- 地板 ---------- */
floorSlab(0,0,W,D,new THREE.MeshStandardMaterial({color:0xcfc7ba,roughness:.9}),0.0);
for(const k in R){ const r=R[k]; floorSlab(r.x0,r.z0,r.x1,r.z1,r.f,0.025); }
// 走道／玄關補地板
floorSlab(0.13,3.30,4.45,3.50,M.woodF,0.025);
floorSlab(0.13,5.78,4.45,5.95,M.woodF,0.025);
floorSlab(0.13,8.08,9.32,8.35,M.tileF,0.025);
floorSlab(6.17,7.05,9.32,8.35,M.woodF,0.025);
// 天花板
const roof = box(W,0.12,D,M.wallO,W/2,H+0.06,D/2,false);

/* ============================================================
   牆
   ============================================================ */
// ---- 外牆（北面整排採光窗）----
wall('x',0,W,0.13,TW,[
  {at:1.85, w:1.90, y0:0.95, y1:2.55, glass:true},   // 主臥窗
  {at:4.86, w:1.60, y0:0.95, y1:2.55, glass:true},   // 臥室二窗
  {at:7.74, w:3.365,y0:0.32, y1:2.72, glass:true},   // ★ 客廳採光窗 336.5cm（落地）
],M.wallO);
wall('x',0,W,D-0.13,TW,[
  {at:1.60, w:1.70, y0:0.95, y1:2.35, glass:true},   // 陽台外窗
  {at:7.60, w:0.70, y0:1.35, y1:2.30, glass:true},   // 次浴小窗
],M.wallO);
wall('z',0,D,0.13,TW,[
  {at:6.95, w:1.40, y0:0.95, y1:2.35, glass:true},   // 臥室三西窗
],M.wallO);
wall('z',0,D,W-0.13,TW,[
  {at:2.30, w:1.50, y0:0.95, y1:2.55, glass:true},   // 客廳東窗
  {at:5.70, w:1.20, y0:0.95, y1:2.45, glass:true},   // 餐廳東窗
],M.wallO);

// ---- 室內隔間 ----
// 主臥 / 臥室二
wall('z',0.13,3.30,3.61,IW,[]);
// 主臥 南牆（門）
wall('x',0.13,3.61,3.30,IW,[{at:3.05,w:0.95,y0:2.10,y1:H}]);
// 臥室二 南牆（門）
wall('x',3.61,6.05,2.95,IW,[{at:5.70,w:0.95,y0:2.10,y1:H}]);
// 客餐廳 西牆（與走廊之間，中段開放）
wall('z',0.13,7.05,6.11,IW,[
  {at:1.40,w:1.10,y0:2.10,y1:H},   // 客廳出入口
  {at:5.30,w:1.60,y0:2.30,y1:H},   // 餐廳大開口
]);
// 主浴廁
wall('x',0.40,3.90,3.50,IW,[{at:3.45,w:0.85,y0:2.05,y1:H}]);
wall('x',0.40,3.90,5.78,IW,[]);
wall('z',3.50,5.78,3.96,IW,[]);
// 臥室三
wall('x',0.40,4.45,5.95,IW,[]);
wall('x',0.40,4.45,8.08,IW,[]);
wall('z',5.95,8.08,4.51,IW,[{at:6.60,w:0.95,y0:2.10,y1:H}]);
// 南側橫隔牆
wall('x',0.13,9.32,8.22,IW,[
  {at:1.60,w:0.90,y0:2.10,y1:H},  // 進工作陽台
  {at:4.60,w:1.70,y0:2.25,y1:H},  // 進廚房（開放）
  {at:7.60,w:0.85,y0:2.05,y1:H},  // 進次浴
]);
// 工作陽台 / 廚房
wall('z',8.35,D-0.13,3.18,IW,[]);
// 廚房 / 次浴
wall('z',8.35,D-0.13,6.48,IW,[]);
wall('z',8.35,10.35,8.86,IW,[]);
wall('x',6.48,8.86,10.40,IW,[]);

/* ============================================================
   家具
   ============================================================ */
function bed(cx,cz,w,l,rot=0){
  const g = new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(w,0.30,l),M.woodD); base.position.y=0.17;
  const mat2=new THREE.Mesh(new THREE.BoxGeometry(w-0.08,0.26,l-0.08),M.fabL); mat2.position.y=0.45;
  const hb=new THREE.Mesh(new THREE.BoxGeometry(w+0.12,0.95,0.10),M.fab); hb.position.set(0,0.48,-l/2-0.03);
  [base,mat2,hb].forEach(o=>{o.castShadow=true;o.receiveShadow=true;g.add(o)});
  for(const s of [-1,1]){
    const p=new THREE.Mesh(new THREE.BoxGeometry(w*0.36,0.12,0.36),M.white);
    p.position.set(s*w*0.22,0.62,-l/2+0.32); p.castShadow=true; g.add(p);
  }
  g.position.set(cx,0.04,cz); g.rotation.y=rot; scene.add(g);
  colliders.push({x0:cx-w/2,x1:cx+w/2,z0:cz-l/2,z1:cz+l/2,y1:0.6});
}
function wardrobe(cx,cz,w,d,rot=0){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,2.35,d),M.wood); b.position.y=1.18;
  b.castShadow=true; g.add(b);
  for(let i=0;i<Math.max(2,Math.round(w/0.55));i++){
    const ln=new THREE.Mesh(new THREE.BoxGeometry(0.015,2.2,0.015),M.dark);
    ln.position.set(-w/2+ (i+1)*w/Math.max(2,Math.round(w/0.55)),1.18,d/2+0.01); g.add(ln);
  }
  g.position.set(cx,0.04,cz); g.rotation.y=rot; scene.add(g);
  colliders.push({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,y1:2.3});
}
function sofa(cx,cz,w,rot=0){
  const g=new THREE.Group();
  const s=new THREE.Mesh(new THREE.BoxGeometry(w,0.42,0.92),M.fab); s.position.y=0.30;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,0.62,0.22),M.fab); b.position.set(0,0.55,-0.36);
  [s,b].forEach(o=>{o.castShadow=true;g.add(o)});
  for(const sgn of [-1,1]){
    const a=new THREE.Mesh(new THREE.BoxGeometry(0.20,0.28,0.92),M.fab);
    a.position.set(sgn*(w/2-0.1),0.60,0); a.castShadow=true; g.add(a);
  }
  g.position.set(cx,0.04,cz); g.rotation.y=rot; scene.add(g);
  colliders.push({x0:cx-w/2,x1:cx+w/2,z0:cz-0.5,z1:cz+0.5,y1:0.8});
}
function table(cx,cz,w,d,h,mat=M.wood){
  box(w,0.06,d,mat,cx,h,cz,true);
  for(const sx of [-1,1]) for(const sz of [-1,1])
    box(0.07,h,0.07,M.woodD,cx+sx*(w/2-0.1),h/2,cz+sz*(d/2-0.1),false);
}
function chair(cx,cz,rot=0){
  const g=new THREE.Group();
  const s=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.05,0.44),M.woodD); s.position.y=0.45;
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.46,0.05),M.woodD); b.position.set(0,0.70,-0.20);
  [s,b].forEach(o=>{o.castShadow=true;g.add(o)});
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const l=new THREE.Mesh(new THREE.BoxGeometry(0.045,0.45,0.045),M.woodD);
    l.position.set(sx*0.18,0.22,sz*0.18); g.add(l);
  }
  g.position.set(cx,0.04,cz); g.rotation.y=rot; scene.add(g);
}
function counter(x0,z0,x1,z1,h=0.90){
  box(x1-x0,h,z1-z0,M.white,(x0+x1)/2,h/2,(z0+z1)/2,true);
  box(x1-x0+0.04,0.05,z1-z0+0.04,M.stone,(x0+x1)/2,h+0.02,(z0+z1)/2,false);
}
function toilet(cx,cz,rot=0){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.38,0.42,0.62),M.white); b.position.y=0.21;

/* ============================================================
   控制
   ============================================================ */
const EYE = 1.62;
const pl = new PointerLockControls(camera, renderer.domElement);
scene.add(pl.object);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enabled=false; orbit.enableDamping=true; orbit.dampingFactor=.07;
orbit.target.set(W/2,0,D/2);

let mode='walk';
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true});
addEventListener('keyup',e=>{keys[e.code]=false});

const startEl=document.getElementById('start'), crossEl=document.getElementById('cross');
startEl.addEventListener('click',()=>{ if(mode==='walk') pl.lock(); });
pl.addEventListener('lock',()=>{startEl.style.display='none';crossEl.style.display='block'});
pl.addEventListener('unlock',()=>{ if(mode==='walk'){startEl.style.display='flex';crossEl.style.display='none'} });

// 起始位置：客廳
camera.position.set(7.75, EYE, 2.90);
camera.lookAt(7.75, EYE, 6.5);

function setMode(m){
  mode=m;
  const walk = (m==='walk');
  orbit.enabled = !walk;
  document.getElementById('m-walk').classList.toggle('on',walk);
  document.getElementById('m-bird').classList.toggle('on',!walk);
  labels.forEach(l=>l.visible=!walk);
  roof.visible = walk ? roofOn : false;
  document.getElementById('jump').style.display = walk?'block':'none';
  document.getElementById('room').style.display = walk?'block':'none';
  if(walk){
    scene.fog.near=30;
    startEl.style.display='flex';
  }else{
    pl.unlock(); crossEl.style.display='none'; startEl.style.display='none';
    scene.fog.near=60;
    camera.position.set(W/2+9, 15.5, D/2+13);
    orbit.target.set(W/2,0,D/2); orbit.update();
  }
}
let roofOn=true;
document.getElementById('m-walk').onclick=()=>setMode('walk');
document.getElementById('m-bird').onclick=()=>setMode('bird');
document.getElementById('m-roof').onclick=()=>{roofOn=!roofOn; roof.visible = (mode==='walk')&&roofOn;};
let night=false;
document.getElementById('m-day').onclick=()=>{
  night=!night;
  sun.intensity   = night?0.12:2.3;
  fill.intensity  = night?0.06:0.5;
  hemi.intensity  = night?0.30:1.9;
  scene.background.set(night?0x05070b:0x0e1218);
  ceilLights.forEach(p=>p.intensity = night?11:5.5);
  renderer.toneMappingExposure = night?1.25:1.05;
};
document.querySelectorAll('#jump button').forEach(b=>{
  b.onclick=()=>{
    const r=R[b.dataset.go]; if(!r) return;
    if(mode!=='walk') setMode('walk');
    camera.position.set((r.x0+r.x1)/2, EYE, (r.z0+r.z1)/2);
  };
});

/* ---------- 碰撞 ---------- */
const RAD=0.26;
function blocked(x,z,y){
  if(x<0.32||x>W-0.32||z<0.32||z>D-0.32) return true;
  for(const c of colliders){
    if(c.y1 < y-0.85) continue;            // 矮過膝的東西可跨過
    if(x>c.x0-RAD && x<c.x1+RAD && z>c.z0-RAD && z<c.z1+RAD) return true;
  }
  return false;
}

/* ---------- 房間偵測 ---------- */
const roomEl=document.getElementById('room');
function whichRoom(x,z){
  for(const k in R){ const r=R[k];
    if(x>=r.x0&&x<=r.x1&&z>=r.z0&&z<=r.z1) return k; }
  return '走廊';
}

/* ---------- 迴圈 ---------- */
const clock=new THREE.Clock();
let lastRoom='';
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  if(mode==='walk' && pl.isLocked){
    const sp=(keys['ShiftLeft']||keys['ShiftRight']?3.4:1.65)*dt;
    const f=(keys['KeyW']?1:0)-(keys['KeyS']?1:0);
    const s=(keys['KeyD']?1:0)-(keys['KeyA']?1:0);
    if(f||s){
      const p=camera.position.clone();
      const dir=new THREE.Vector3(); camera.getWorldDirection(dir); dir.y=0; dir.normalize();
      const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
      const mv=dir.multiplyScalar(f*sp).add(right.multiplyScalar(s*sp));
      const eye=camera.position.y;
      if(!blocked(p.x+mv.x,p.z,eye)) camera.position.x+=mv.x;
      if(!blocked(camera.position.x,p.z+mv.z,eye)) camera.position.z+=mv.z;
    }
    const target = keys['Space']? 2.45 : EYE;
    camera.position.y += (target-camera.position.y)*Math.min(1,dt*7);
    const rm=whichRoom(camera.position.x,camera.position.z);
    if(rm!==lastRoom){
      lastRoom=rm;
      const r=R[rm];
      roomEl.innerHTML = rm + '<small>' + (r? r.area.toFixed(1)+' ㎡ ／ '+(r.area/3.305785).toFixed(1)+' 坪' : '通道') + '</small>';
    }
  }else if(mode!=='walk'){ orbit.update(); }
  renderer.render(scene,camera);
}
tick();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
window.__ready = true;
