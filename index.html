<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1218">
<link rel="icon" href="data:,">
<title>A8 戶 3D 看屋</title>
<style>
  :root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
  html,body{margin:0;height:100%;overflow:hidden;background:#11141a;
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}
  #app{position:fixed;inset:0}
  #hud{position:fixed;left:calc(16px + var(--sl));top:calc(16px + var(--st));background:rgba(14,18,26,.82);
    border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;
    font-size:13px;line-height:1.85;backdrop-filter:blur(10px);max-width:270px;z-index:10}
  #hud h1{margin:0 0 8px;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:10px;justify-content:space-between}
  #hudfold{background:#223044;border:1px solid #3d4b5f;color:#cfe0f5;border-radius:7px;font:inherit;font-size:11px;
    font-weight:500;letter-spacing:0;padding:1px 8px;cursor:pointer;white-space:nowrap}
  #hudfold:hover{background:#2c3a4e}
  #hud.folded .fold{display:none}
  #hud.folded h1{margin-bottom:2px}
  #hud .k{display:inline-block;background:#2a3444;border:1px solid #3d4b5f;border-radius:5px;
    padding:1px 7px;margin-right:4px;font-size:11px;font-weight:600}
  #hud .dim{color:#93a3b8;font-size:11.5px}
  #room{position:fixed;left:50%;bottom:calc(34px + var(--sb));transform:translateX(-50%);
    background:rgba(14,18,26,.85);border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:9px 26px;font-size:16px;font-weight:600;letter-spacing:2px;z-index:10;white-space:nowrap}
  #room small{display:block;font-size:11px;font-weight:400;color:#93a3b8;letter-spacing:.5px;text-align:center}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,10,14,.45);z-index:9;cursor:pointer;flex-direction:column;gap:14px}
  #start .box{background:#161c26;border:1px solid #2c3746;border-radius:18px;
    padding:34px 46px;text-align:center;max-width:420px;margin:0 16px}
  #start h2{margin:0 0 10px;font-size:22px}
  #start p{margin:6px 0;color:#9fb0c4;font-size:13.5px;line-height:1.8}
  #start .go{margin-top:18px;background:#3b82f6;border-radius:10px;padding:12px 30px;
    font-weight:700;font-size:15px;display:inline-block}
  #modes{position:fixed;right:calc(16px + var(--sr));top:calc(16px + var(--st));display:flex;flex-direction:column;gap:8px;z-index:10}
  #modes button{background:rgba(14,18,26,.85);color:#fff;border:1px solid rgba(255,255,255,.16);
    border-radius:10px;padding:9px 15px;font-size:13px;cursor:pointer;font-family:inherit;
    transition:.15s;min-width:132px;text-align:left}
  #modes button:hover{background:#243044;border-color:#4b5f7a}
  #modes button.on{background:#3b82f6;border-color:#60a5fa}
  #modes button:disabled{opacity:.4;cursor:default;background:rgba(14,18,26,.85);border-color:rgba(255,255,255,.16)}
  #jump{position:fixed;right:calc(16px + var(--sr));top:150px;background:rgba(14,18,26,.85);
    border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px;z-index:10;width:132px;box-sizing:border-box;
    overflow-y:auto;overscroll-behavior:contain}
  #jump .jh{display:block;width:100%;background:none;border:0;padding:0 0 6px;margin:0;font:inherit;font-size:11px;color:#93a3b8;
    letter-spacing:1px;text-align:left;cursor:pointer}
  #jump.closed .jh{padding:0}
  #jump.closed .jl{display:none}
  #jump .jl button{display:block;width:100%;background:#1d2532;color:#dbe6f3;border:1px solid #2f3b4d;
    border-radius:7px;padding:6px 8px;margin-bottom:5px;font-size:12.5px;cursor:pointer;
    font-family:inherit;text-align:left}
  #jump .jl button:hover{background:#2c3a4e}
  #note{position:fixed;left:calc(16px + var(--sl));bottom:calc(16px + var(--sb));font-size:11px;color:#6b7a8d;z-index:10;line-height:1.7}
  .cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;background:rgba(255,255,255,.5);z-index:5;pointer-events:none}
  #stick{position:fixed;left:calc(20px + var(--sl));bottom:calc(90px + var(--sb));width:124px;height:124px;border-radius:50%;
    background:rgba(18,24,34,.5);border:1px solid rgba(255,255,255,.2);z-index:20;display:none;touch-action:none}
  #knob{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;
    background:rgba(120,165,225,.9);pointer-events:none}
  #todbox{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}
  #hud.folded #todbox{margin-top:4px}
  #todbox input{flex:1;min-width:0;accent-color:#f2b35b;cursor:pointer}
  #todbox b{font-variant-numeric:tabular-nums;min-width:40px;text-align:right;color:#f6d7a8}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  #labels .lb{position:absolute;left:0;top:0;display:none;white-space:nowrap;text-align:center;
    background:rgba(250,247,241,.84);color:#3b342d;border-radius:999px;padding:3px 11px 4px;
    box-shadow:0 1px 3px rgba(40,30,20,.18);will-change:transform}
  #labels .lb b{display:block;font-size:14px;font-weight:600;letter-spacing:1px;line-height:1.3}
  #labels .lb small{display:block;font-size:11px;color:#76695b;line-height:1.25;font-variant-numeric:tabular-nums}
  #toast{position:fixed;left:50%;top:calc(18px + var(--st));transform:translateX(-50%);z-index:40;display:none;
    background:rgba(14,18,26,.9);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 16px;font-size:13px}
  #loading{position:fixed;inset:0;z-index:100;background:#0b0e13;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;color:#9fb0c4;font-size:14px;letter-spacing:1px;text-align:center;padding:0 24px}
  #loading .track{width:220px;height:4px;border-radius:2px;background:#1e2633;overflow:hidden}
  #loadbar{height:100%;width:0;background:#f2b35b;transition:width .2s}
  #loadsub{font-size:12px;color:#6b7a8d;letter-spacing:.5px;min-height:1.2em;line-height:1.7}
  @media (max-width:760px){#hud{max-width:190px;font-size:11px;padding:11px 13px}
    #hud h1{font-size:14px}#modes button{min-width:104px;font-size:12px;padding:8px 11px}
    #jump{width:104px;top:auto;bottom:calc(14px + var(--sb))}#jump .jl button{font-size:11.5px;padding:5px 7px}
    #labels .lb{padding:2px 9px 3px}#labels .lb b{font-size:12.5px}#labels .lb small{font-size:10px}
    #note{display:none}}
  @media (max-width:400px){#room{bottom:calc(66px + var(--sb))}}   /* 很窄的手機：房間名稱往上移，不壓到右下角的「傳送」鈕 */
</style>
</head>
<body>
<div id="app"></div>
<div id="loading"><div id="loadmsg">🏠 正在把你家蓋起來…</div><div class="track"><div id="loadbar"></div></div><div id="loadsub">正在下載 3D 程式</div></div>
<script>
/* 開不起來時不要讓人對著載入畫面一直等：程式檔下載失敗、瀏覽器太舊、沒有 WebGL2、啟動途中出錯 → 換成一句白話說明 */
(function(){
  var done = false;
  function fail(why){
    if(window.__ready || done) return; done = true;
    var l = document.getElementById('loading'); if(!l) return;
    l.innerHTML = '<div style="font-size:16px;color:#e6edf6">😥 3D 看屋沒有順利打開</div>' +
      '<div style="font-size:13px;color:#9fb0c4;line-height:1.9;max-width:380px">先重新整理一次（多半是網路一時不穩）；<br>還是不行的話，請改用最新版的 Chrome、Safari 或 Edge。</div>' +
      (why ? '<div style="font-size:11px;color:#56647a;max-width:340px;word-break:break-all">（' + String(why).slice(0, 160).replace(/[<>&]/g, '') + '）</div>' : '');
  }
  window.__a8fail = fail;
  try{
    var cv = document.createElement('canvas');
    if(!(cv.getContext('webgl2'))) fail('這個瀏覽器沒有開啟 WebGL2');
  }catch(e){ fail('WebGL2'); }
  if(window.HTMLScriptElement && HTMLScriptElement.supports && !HTMLScriptElement.supports('importmap')) fail('瀏覽器版本太舊');
  // 只管這個網站自己的程式出錯（瀏覽器外掛的錯誤不算）；模組啟動途中丟出的錯誤（含 await 失敗）都會走這裡
  addEventListener('error', function(e){ if(!window.__ready && e && e.message && (!e.filename || e.filename.indexOf(location.origin) === 0)) fail(e.message); });
  setTimeout(function(){ if(!window.__ready && !done){ var s = document.getElementById('loadsub'); if(s) s.textContent = '網路比較慢，還在下載中…'; } }, 25000);
  setTimeout(function(){ if(!window.__ready && !done){ var s = document.getElementById('loadsub'); if(s) s.innerHTML = '等了很久都沒好的話，請重新整理頁面'; } }, 90000);
})();
</script>
<div class="cross" id="cross" style="display:none"></div>
<div id="labels"></div>

<div id="hud">
  <h1><span>A8 戶 · 3D 看屋</span><button id="hudfold" type="button">收起 ▴</button></h1>
  <div class="dim fold">室內 27 坪（89.3 ㎡）＋工作陽台 1.8 坪<br>樓高 3.25 m ・ 三房兩廳兩衛<br>各房間標的是牆內淨面積（27 坪含牆、柱）</div>
  <hr class="fold" style="border:0;border-top:1px solid #2b3545;margin:10px 0">
  <div id="hint" class="fold"></div>
  <div id="todbox" title="拉一下，看一整天的光線"><span>🌤</span><input id="tod" type="range" min="5" max="23.5" step="0.25" value="14"><b id="todv">14:00</b></div>
</div>

<div id="modes">
  <button id="m-walk" class="on" type="button">🚶 走進去看</button>
  <button id="m-bird" type="button">🏠 俯瞰全屋</button>
  <button id="m-roof" type="button">🔲 屋頂：開</button>
  <button id="m-photo" type="button" style="display:none">📸 拍照級畫面</button>
</div>

<div id="jump">
  <button class="jh" type="button">📍 快速傳送</button>
  <div class="jl"></div>
</div>

<div id="room">客廳<small>站在這裡</small></div>
<div id="note">依建商平面圖重建 · 比例依「室內 27 坪」推算，樓高 3.25 m<br>家具為示意 · 非施工圖，實際尺寸以建商圖說為準</div>
<div id="toast"></div>

<div id="start"><div class="box">
  <h2>🏠 準備進入你家</h2>
  <p>點一下畫面 → 滑鼠會被鎖住，就可以像玩遊戲一樣在屋子裡走動。</p>
  <p>想退出來，按鍵盤左上角的 <b>Esc</b>。</p>
  <p style="color:#6b7a8d">不想走路的話，右上角有「俯瞰全屋」可以直接看格局。</p>
  <div class="go">點擊進入</div>
</div></div>

<script type="importmap">
{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/","three-mesh-bvh":"./lib/pathtracer/three-mesh-bvh.module.js"}}
</script>
<script type="module" src="./js/main.js" onerror="window.__a8fail && window.__a8fail('程式檔案下載失敗')"></script>
</body>
</html>
